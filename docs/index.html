<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fossyl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/thin/style.css">
<style>
  *,:before,:after{box-sizing:border-box}
  :root{
    --bg:#000000; --surface:#111111; --surface-2:#1a1a1a;
    --ink:#f3f3f1; --ink-2:#b4b4b9; --ink-3:#97979e;
    --line:#242424; --line-2:#313135;
    --accent:#f3f3f1; --on-accent:#111113;
    --frost-bg: rgba(17,17,17,0.62); --frost-border: rgba(255,255,255,0.10);
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);height:100%}
  body{
    font-family:'Manrope',system-ui,sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex; flex-direction:column;
    position:relative;
    overflow-x:hidden;
  }
  body *{ font-weight:400; }
  .tnum{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(1100px 600px at 12% -10%, rgba(255,255,255,0.05), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(255,255,255,0.04), transparent 55%);
    pointer-events:none;
  }
  .wrap{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 6vh 1.5rem;
    position:relative; z-index:1;
  }
  .brand{ display:flex; flex-direction:column; align-items:center; gap:.85rem; margin-bottom:3.5rem; }
  .brand svg{ color:var(--ink); }
  .brand-name{ display:flex; align-items:baseline; justify-content:center; gap:.35rem; }
  .lockup-main{ font-size:1.3rem; letter-spacing:-0.02em; }
  .lockup-sub{ font-size:.7rem; color:var(--ink-3); letter-spacing:.01em; }
  .brand-tag{ font-size:.78rem; color:var(--ink-3); letter-spacing:.02em; margin-top:.2rem; }
  h1{
    font-size:clamp(1.6rem, 3.6vw, 2.5rem);
    letter-spacing:-0.03em; line-height:1.1;
    text-align:center; max-width:20ch; margin:0 0 .65rem;
  }
  p.lede{
    color:var(--ink-2); text-align:center; font-size:.95rem;
    max-width:38ch; margin:0 0 3rem; line-height:1.55;
  }
  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:1.1rem;
    width:100%; max-width:720px;
  }
  @media (max-width:640px){ .grid{ grid-template-columns:1fr; } }
  a.card{
    text-decoration:none; color:inherit;
    background:var(--frost-bg);
    -webkit-backdrop-filter:blur(14px) saturate(120%);
    backdrop-filter:blur(14px) saturate(120%);
    border:1px solid var(--frost-border);
    border-radius:4px;
    padding:2.1rem 1.75rem;
    display:flex; flex-direction:column; gap:1.1rem;
    transition:border-color .18s ease, transform .18s ease, background .18s ease;
  }
  a.card:hover{
    border-color:rgba(255,255,255,0.22);
    background:rgba(26,26,26,0.65);
    transform:translateY(-2px);
  }
  a.card:active{ transform:translateY(0px); }
  .card-icon{
    height:52px; width:52px; border-radius:4px;
    display:grid; place-items:center;
    border:1px solid var(--line-2);
    background:var(--surface-2);
    font-size:1.6rem; color:var(--ink);
  }
  .card h2{ font-size:1.15rem; letter-spacing:-0.01em; margin:0; }
  .card p{ font-size:.85rem; color:var(--ink-3); line-height:1.5; margin:0; }
  .card .go{
    margin-top:.15rem;
    display:flex; align-items:center; gap:.4rem;
    font-size:.8rem; color:var(--ink-2);
  }
  .card .go i{ font-size:1rem; transition:transform .18s ease; }
  a.card:hover .go i{ transform:translateX(3px); }
  footer{
    text-align:center; font-size:.72rem; color:var(--ink-3);
    letter-spacing:.02em; padding:1.75rem 1rem 2rem; position:relative; z-index:1;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 127 127" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-label="Fossyl" role="img">

        <path d="M63.5 0L65.9102 55.3609C66.04 58.2161 68.3204 60.4965 71.1756 60.6263L126.536 63.0365L71.1756 65.4467C68.3204 65.5765 66.04 67.8569 65.9102 70.7121L63.5 126.073L61.0898 70.7121C60.96 67.8569 58.6796 65.5765 55.8244 65.4467L0.463501 63.0365L55.8244 60.6263C58.6796 60.4965 60.96 58.2161 61.0898 55.3609L63.5 0Z"/>
      </svg>
      <div style="text-align:center">
        <div class="brand-name"><span class="lockup-main">Glance</span> <span class="lockup-sub">by fossyl</span></div>
        <div class="brand-tag">capture.preserve.experience</div>
      </div>
    </div>

    <h1>Pick your vertical.</h1>
    <div style="height:1.75rem"></div>
    <div class="grid">
      <a class="card" href="/real-estate">
        <div class="card-icon"><i class="ph-thin ph-buildings"></i></div>
        <div>
          <h2>Real Estate</h2>
          <p>Lead intelligence, 3D walkthroughs and site-visit analytics for property sales teams.</p>
        </div>
        <span class="go">Enter <i class="ph-thin ph-arrow-right"></i></span>
      </a>

      <a class="card" href="/hospitality">
        <div class="card-icon"><i class="ph-thin ph-martini"></i></div>
        <div>
          <h2>Hospitality</h2>
          <p>Immersive venue tours and guest-engagement insight for hotels, resorts and F&amp;B spaces.</p>
        </div>
        <span class="go">Enter <i class="ph-thin ph-arrow-right"></i></span>
      </a>
    </div>
  </div>
  <footer>&copy; <span id="y"></span> Fossyl</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
