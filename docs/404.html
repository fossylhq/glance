<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fossyl · Not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/thin/style.css">
<style>
  *,:before,:after{box-sizing:border-box}
  :root{
    --bg:#000000; --ink:#f3f3f1; --ink-2:#b4b4b9; --ink-3:#97979e;
    --line-2:#313135; --on-accent:#111113; --accent:#f3f3f1;
    --frost-bg: rgba(17,17,17,0.62); --frost-border: rgba(255,255,255,0.10);
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
  body{
    font-family:'Manrope',system-ui,sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:1.5rem; position:relative; overflow:hidden;
  }
  body *{ font-weight:400; }
  .tnum{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  body::before{
    content:""; position:fixed; inset:0;
    background: radial-gradient(900px 500px at 50% -10%, rgba(255,255,255,0.06), transparent 60%);
    pointer-events:none;
  }
  .card{
    position:relative; z-index:1;
    text-align:center; max-width:26rem; width:100%;
    background:var(--frost-bg);
    -webkit-backdrop-filter:blur(14px) saturate(120%);
    backdrop-filter:blur(14px) saturate(120%);
    border:1px solid var(--frost-border);
    border-radius:4px;
    padding:3rem 2.25rem;
  }
  .icon{ font-size:2.4rem; color:var(--ink-3); margin-bottom:1.25rem; }
  .code{ font-size:3.5rem; letter-spacing:-0.03em; line-height:1; margin:0 0 .6rem; }
  h1{ font-size:1.15rem; margin:0 0 .5rem; letter-spacing:-0.01em; }
  p{ color:var(--ink-2); font-size:.9rem; line-height:1.55; margin:0 0 2rem; }
  a.btn{
    display:inline-flex; align-items:center; gap:.5rem;
    text-decoration:none; font-size:.9rem;
    padding:.8rem 1.5rem; border-radius:4px;
    background:var(--accent); color:var(--on-accent);
    transition:opacity .15s ease, transform .15s ease;
  }
  a.btn:hover{ opacity:.88; }
  a.btn:active{ transform:translateY(1px); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="ph-thin ph-compass"></i></div>
    <p class="code tnum">404</p>
    <h1>This page doesn't exist.</h1>
    <p>The link may be broken, or the page may have moved.</p>
    <a class="btn" href="/">Back to home <i class="ph-thin ph-arrow-right"></i></a>
  </div>
</body>
</html>
